[project]
name = "emberwatch"
version = "0.1.0"
description = "Real-time industrial fire and smoke detection with temporal alerting, evaluated honestly (including false alarms)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa" }]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "pillow>=10.3",
  "pyarrow>=16",
  "matplotlib>=3.8",
  "opencv-python>=4.9",
]

[project.scripts]
emberwatch = "emberwatch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emberwatch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long prose strings; ruff format handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
